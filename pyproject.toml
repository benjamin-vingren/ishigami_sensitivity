[project]
name = "ishigami-sensitivity"
version = "0.1.0"
description = "Surrogate assisted sensitivity analysis of the Ishigami function"
requires-python = ">=3.14"
dependencies = [
    "cloudpickle==3.1.2",
    "contourpy==1.4.0",
    "cycler==0.12.1",
    "dill==0.4.1",
    "fonttools==4.68.0",
    "joblib==1.6.0",
    "kiwisolver==1.5.1",
    "matplotlib==3.11.2",
    "multiprocess==0.70.19",
    "narwhals==2.28.0",
    "numpy==2.5.4",
    "packaging==26.3",
    "pandas==3.1.0",
    "pillow==13.0.0",
    "pyparsing==3.3.3",
    "python-dateutil==3.0.0",
    "salib==1.6.0",
    "scikit-learn==1.9.1",
    "scipy==1.18.1",
    "six==1.17.0",
    "threadpoolctl==3.7.0",
    "tzdata==2026.5",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 88
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
unfixable = ["F401"]
